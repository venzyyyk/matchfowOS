  --ground:#070607; --ground-2:#0A0909; --surface:#100E0E; --surface-2:#171414; --surface-3:#201C1B;
  --line:rgba(255,214,170,.10); --line-2:rgba(255,214,170,.20);
  --ink:#F2ECE6; --ink-2:#AEA49C; --ink-3:#71675F;
  --core:#FF7A1A; --core-2:#FFB067; --core-soft:rgba(255,122,26,.14);
  --amber:#F5902B; --amber-2:#FFB86B; --amber-dim:rgba(245,144,43,.14);
  --steel:#9BB4C7; --steel-dim:rgba(155,180,199,.13);
  --gold:#E8C56A; --gold-dim:rgba(232,197,106,.13);
  --ok:#3FCF8E; --ok-dim:rgba(63,207,142,.13);
  --bad:#FF5757; --bad-dim:rgba(255,87,87,.13);

  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --disp:"Unbounded","Golos Text",system-ui,sans-serif;

  --sh:0 18px 50px -24px rgba(0,0,0,.92);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,214,170,.14);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,214,170,.26)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.h-page{font-size:22px;line-height:1.15}
.h-sec{font-size:11.5px;font-family:var(--disp);font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--ink-2)} .dim{color:var(--ink-3)}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--top) 1fr;height:100dvh}
.rail{grid-row:1/3;border-right:1px solid var(--line);background:var(--ground-2);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:20}

<script id="app-code">
'use strict';
/* ============================================================
   MATCHFLOW OS · VENARION HUMAN CORE — этап 2
   Этап 1: мультитурниры, 8 статусов, ручная сетка, MF-ID,
           замена по ID, фора и стол при запуске матча.
   Этап 2: MATCH RATING (Elo/Fargo), RELIABILITY, карьера игрока,
           спортивный паспорт, таблица рейтинга, видео-столы.
   ============================================================ */

const DEF_CATS=[
 {code:'STARTING',c:'#6B7A85'},{code:'NEWBIE',c:'#7E96A6'},{code:'PROGRESSIVE',c:'#93B0C3'},
 {code:'AMATEUR',c:'#BCC7CC'},{code:'AMATEUR PLUS',c:'#E0B584'},{code:'SEMI-PRO',c:'#F0983F'},
 {code:'PRO',c:'#FF7A1A'},{code:'DIAMOND',c:'#FFE9BF'}
];
/* Статусы турнира — порядок = порядок жизни турнира */
const TS=[
 {k:'announced',ru:'Анонсирован',    chip:'st',  hint:'Виден всем: название и видео-регламент'},
 {k:'planned',  ru:'Запланирован',   chip:'',    hint:'Виден всем, но только название'},
 {k:'reg',      ru:'Идёт регистрация',chip:'ok', hint:'Заявки принимаются'},
 {k:'closed',   ru:'Регистрация окончена',chip:'',hint:'Состав виден, заявки закрыты'},
 {k:'drawn',    ru:'Сформирована сетка',chip:'st',hint:'Сетка опубликована, матчи ещё не идут'},
 {k:'running',  ru:'Проходит сейчас',chip:'live',hint:'Идут матчи, работает табло'},
 {k:'done',     ru:'Окончен',        chip:'gold',hint:'Протокол закрыт'},
 {k:'trash',    ru:'На удаление',    chip:'bad', hint:'Виден только судье'}
];
const tsOf=k=>TS.find(s=>s.k===k)||TS[1];

/* ---------- СОСТОЯНИЕ ---------- */
let ST=JSON.parse(document.getElementById('app-state').textContent);
let ADMIN=sessionStorage.getItem('mfos-adm')==='1';
let CAP=null,LOCAL=false,SYNC='ok',pubT=null;
let MODE='local',REV=0,PIN=sessionStorage.getItem('mfos-pin')||'',pollT=null;
const S={view:'tours',player:null,openM:null,hot:null,q:'',slot:null,tq:'',rq:''};

/* ---------- МИГРАЦИЯ СТАРОГО СОСТОЯНИЯ ---------- */
function migrate(s){
 if(s.v>=4){s.hist=s.hist||[];return s}
 if(s.v===3){s.v=4;s.hist=s.hist||[];return s}
 const t=s.t||{};
 const tour={id:'t1',name:t.name||'Турнир',sub:t.sub||'',disc:t.disc||'Вільна піраміда',
  venue:t.venue||'',dates:t.dates||'',fee:t.fee||'',prize:t.prize||'',
  race:t.race||5,tables:t.tables||4,video:'',
  status:t.status==='live'?'running':t.status==='done'?'done':'reg',pub:true,
  entries:[],br:s.br||null,seq:s.seq||0,feed:s.feed||[]};
 const players=[];
 (s.players||[]).forEach((p,i)=>{
  players.push({id:p.id,mid:p.mid||null,name:p.name,city:p.city||'',club:p.club||'',contact:p.contact||'',cat:p.cat|0});
  tour.entries.push({p:p.id,st:p.st||'new',seed:p.seed||null,w:p.w||0,l:p.l||0,place:p.place||null});
 });
 return {v:4,cats:s.cats||DEF_CATS,players,tours:[tour],cur:'t1',hist:[],
  pin:s.pin||'2604',midPrefix:s.midPrefix||'123',midSeq:s.midSeq||0,arch:s.arch||[]};
}
ST=migrate(ST);

/* ---------- УТИЛИТЫ ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=()=>ST.cats&&ST.cats.length?ST.cats:DEF_CATS;
const catOf=p=>{const c=CATS();return c[Math.max(0,Math.min(c.length-1,(p&&p.cat)|0))]};
const P=id=>ST.players.find(p=>p.id===id);
const byMid=m=>ST.players.find(p=>p.mid===m);
const T=()=>ST.tours.find(t=>t.id===ST.cur)||ST.tours[0];
const E=()=>{const t=T();return t?t.entries:[]};
const ent=pid=>E().find(e=>e.p===pid);
const initials=n=>String(n).trim().split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
const short=n=>{const s=String(n).trim().split(/\s+/);return s.length>1?s[1]+' '+s[0][0]+'.':n};
const nmOf=id=>{if(id==='BYE')return 'свободный проход';const p=P(id);return p?short(p.name):'—'};
const now=()=>new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
const uid=p=>p+Math.random().toString(36).slice(2,8);
const approved=()=>E().filter(e=>e.st==='ok');
const pending=()=>E().filter(e=>e.st==='new');
function toast(t){const n=$('#toast');if(!n)return;n.textContent=t;n.classList.add('on');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('on'),2400)}
function nextMid(){
 ST.midSeq=(ST.midSeq||0)+1;
 return (ST.midPrefix||'123')+'-'+String(ST.midSeq).padStart(3,'0');
}
function ensureMid(p){if(!p.mid)p.mid=nextMid();return p.mid}

/* видимость турнира для не-судьи */
const visible=t=>t.pub&&t.status!=='trash';
const showsSquad=t=>['reg','closed','drawn','running','done'].indexOf(t.status)>=0;
const showsBracket=t=>['drawn','running','done'].indexOf(t.status)>=0;
const regOpen=t=>t.status==='reg';

function catSvg(p,s){
 const c=catOf(p).c;s=s||15;
 return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke="${c}" stroke-width="1.5"/><circle cx="12" cy="12" r="2.6" fill="${c}" opacity=".75"/></svg>`;
}
const catBadge=(p,s)=>`<span class="rk">${catSvg(p,s)}<span class="rn" style="color:${catOf(p).c}">${esc(catOf(p).code)}</span></span>`;
function pline(id,sub){
 if(id==='BYE')return `<span class="pl"><span class="dim" style="font-style:italic">свободный проход</span></span>`;
 const p=P(id);if(!p)return `<span class="pl"><span class="dim">—</span></span>`;
 const c=catOf(p).c;
 return `<span class="pl"><span class="av" style="background:${c}22;color:${c};border:1px solid ${c}44">${esc(initials(p.name))}</span>
  <span style="min-width:0"><span class="nm">${esc(p.name)}</span>${sub?`<span class="sub" style="display:block">${esc(sub)}</span>`:''}</span></span>`;
}

/* ============================================================
   MATCH RATING — реальная сила игрока (этап 2)
   Философия Elo/Fargo: обыграл сильного — большой прирост,
   обыграл намного слабее — маленький; проиграл слабому — больно.
   ============================================================ */
const RBASE=1000,RSTEP=55,RMIN=300;
/* стартовый рейтинг = от разряда, середина шкалы разрядов = RBASE */
const r0=p=>Math.round(RBASE+(((p&&p.cat)|0)-(CATS().length-1)/2)*RSTEP);
const RT=p=>p?(typeof p.r==='number'?p.r:r0(p)):0;
/* надёжность: сколько матчей система про игрока знает */
const relOf=p=>Math.min(99,Math.round(100*(1-Math.exp(-(((p&&p.rm)|0))/18))));
const kOf=p=>40-24*(relOf(p)/100);           /* новичок двигается быстро, ветеран — медленно */
const expect=(ra,rb)=>1/(1+Math.pow(10,(rb-ra)/400));
const relTag=p=>{const r=relOf(p);return r>=80?'ok':r>=45?'st':''};

/* записать результат матча в рейтинг */
function rate(id){
 const t=T(),m=MM(id);
 if(!m||m.bye||m.rated)return;
 const w=winId(m),l=losId(m);
 if(!w||!l||w==='BYE'||l==='BYE')return;
 const pw=P(w),pl=P(l);if(!pw||!pl)return;
 if(typeof pw.r!=='number')pw.r=r0(pw);
 if(typeof pl.r!=='number')pl.r=r0(pl);
 const bw=pw.r,bl=pl.r;
 const race=t.race||5,gap=Math.abs(m.sa-m.sb);
 const mf=Math.max(.8,Math.min(1.3,.85+.45*(gap/race)));   /* разгромная победа весит чуть больше */
 const K=(kOf(pw)+kOf(pl))/2;
 const d=Math.max(1,Math.round(K*mf*(1-expect(bw,bl))));
 pw.r=bw+d;pl.r=Math.max(RMIN,bl-d);
 pw.rm=(pw.rm|0)+1;pl.rm=(pl.rm|0)+1;
 m.rated={w,l,d,bw,bl};
 ST.hist=ST.hist||[];
 ST.hist.unshift({tid:t.id,tn:t.name,mid:id,lab:labOf(id),w,l,
  sw:Math.max(m.sa,m.sb),sl:Math.min(m.sa,m.sb),d,rw:pw.r,rl:pl.r,at:Date.now()});
 if(ST.hist.length>1500)ST.hist.pop();
 return d;
}
function unrate(id){
 const m=MM(id),x=m&&m.rated;if(!x)return;
 const pw=P(x.w),pl=P(x.l);
 if(pw){pw.r=x.bw;pw.rm=Math.max(0,(pw.rm|0)-1)}
 if(pl){pl.r=x.bl;pl.rm=Math.max(0,(pl.rm|0)-1)}
 ST.hist=(ST.hist||[]).filter(h=>!(h.tid===T().id&&h.mid===id));
 m.rated=null;
}
/* карьера игрока по всей истории, а не по одному турниру */
function career(pid){
 const h=(ST.hist||[]).filter(x=>x.w===pid||x.l===pid);
 const n=h.length,wins=h.filter(x=>x.w===pid).length;
 let form=0;h.slice(0,10).forEach(x=>form+=x.w===pid?x.d:-x.d);
 let best=0,cur=0;
 for(let i=h.length-1;i>=0;i--){if(h[i].w===pid){cur++;if(cur>best)best=cur}else cur=0}
 let streak=0,sw=n&&h[0].w===pid;
 for(let i=0;i<n;i++){if((h[i].w===pid)===sw)streak++;else break}
 return {n,wins,losses:n-wins,wr:n?Math.round(wins*1000/n)/10:0,form,best,streak,sw,h};
}
/* сколько рейтинга разыгрывается: сколько получит A при победе / сколько получит B */
function stake(m){
 const t=T(),pa=P(m.a),pb=P(m.b);
 if(!pa||!pb)return '—';
 const ra=RT(pa),rb=RT(pb),K=(kOf(pa)+kOf(pb))/2,mf=1.07;
 const da=Math.max(1,Math.round(K*mf*(1-expect(ra,rb))));
 const db=Math.max(1,Math.round(K*mf*(1-expect(rb,ra))));
 return '+'+da+' / +'+db;
}
const ranked=()=>ST.players.slice().sort((a,b)=>RT(b)-RT(a)||(b.rm|0)-(a.rm|0)||a.name.localeCompare(b.name,'uk'));
const rankOf=pid=>ranked().findIndex(p=>p.id===pid)+1;

/* ---------- ГЕНЕРАТОР СЕТКИ ---------- */
function buildSpec(N){
 const k=Math.round(Math.log2(N)),spec=[],wb=[];let wi=1;
 for(let r=1;r<=k;r++){
  const cnt=N>>r,idsx=[];
  for(let i=0;i<cnt;i++){const id='W'+(wi++);idsx.push(id);
   spec.push(r===1?[id,'W',1,null,null]:[id,'W',r,wb[r-2][i*2]+':w',wb[r-2][i*2+1]+':w'])}
  wb.push(idsx);
 }
 let li=1,lr=1,prev=[];
 {const cnt=N>>2,idsx=[];
  for(let i=0;i<cnt;i++){const id='L'+(li++);idsx.push(id);spec.push([id,'L',lr,wb[0][i*2]+':l',wb[0][i*2+1]+':l'])}
  prev=idsx;lr++}
 for(let t=2;t<=k;t++){
  const src=wb[t-1].slice().reverse(),idsx=[];
  for(let i=0;i<prev.length;i++){const id='L'+(li++);idsx.push(id);spec.push([id,'L',lr,prev[i]+':w',src[i]+':l'])}
  prev=idsx;lr++;
  if(prev.length>1){const i2=[];
   for(let i=0;i<prev.length/2;i++){const id='L'+(li++);i2.push(id);spec.push([id,'L',lr,prev[i*2]+':w',prev[i*2+1]+':w'])}
   prev=i2;lr++}
 }
 spec.push(['GF','F',1,wb[k-1][0]+':w',prev[0]+':w']);
 return {spec,k,N,lbR:lr-1};
}
let SP=null,SPfor=null;
function spec(){const t=T();if(!t||!t.br)return null;
 if(!SP||SPfor!==t.id||SP.N!==t.br.N){SP=buildSpec(t.br.N);SPfor=t.id}return SP}
const ids=()=>spec()?spec().spec.map(s=>s[0]):[];
const sp1=id=>spec().spec.find(s=>s[0]===id);
const MM=id=>T().br.m[id];
function labOf(id){
 const s=sp1(id),N=T().br.N;
 if(s[1]==='F')return 'Гранд-финал';
 if(s[1]==='W'){const r=N>>s[2];return r===1?'Финал верхней':r===2?'Полуфинал':'1/'+r+' финала'}
 return s[2]===spec().lbR?'Финал нижней':'Нижняя · R'+s[2];
}
function labGen(id){
 const s=sp1(id),N=T().br.N;
 if(s[1]==='F')return 'гранд-финала';
 if(s[1]==='W'){const r=N>>s[2];return r===1?'финала верхней':r===2?'полуфинала':'1/'+r+' финала'}
 return s[2]===spec().lbR?'финала нижней':'нижней R'+s[2];
}
function seedOrder(N){let a=[1,2];while(a.length<N){const n=a.length*2,b=[];a.forEach(s=>{b.push(s);b.push(n+1-s)});a=b}return a}
const sizeFor=n=>n<=4?4:n<=8?8:n<=16?16:32;
const winId=m=>m.st==='done'?(m.sa>m.sb?m.a:m.b):null;
const losId=m=>m.st==='done'?(m.sa>m.sb?m.b:m.a):null;
function feed(txt){const t=T();t.feed.unshift({t:now(),txt});if(t.feed.length>60)t.feed.pop()}

function advance(id){
 const m=MM(id),w=winId(m),l=losId(m),t=T();
 spec().spec.forEach(s=>{const x=t.br.m[s[0]];
  if(s[3]===id+':w')x.a=w; if(s[4]===id+':w')x.b=w;
  if(s[3]===id+':l')x.a=l; if(s[4]===id+':l')x.b=l});
}
function resolveByes(){
 let ch=true,g=0;
 while(ch&&g++<40){ch=false;
  ids().forEach(id=>{const m=MM(id);
   if(m.st!=='pending'||!m.a||!m.b)return;
   if(m.a==='BYE'&&m.b==='BYE'){m.st='done';m.sa=0;m.sb=0;m.bye=1;advance(id);ch=true;return}
   if(m.a==='BYE'||m.b==='BYE'){m.st='done';m.bye=1;m.sa=m.a==='BYE'?0:T().race;m.sb=m.b==='BYE'?0:T().race;advance(id);ch=true}});
 }
}

/* ---------- ДЕЙСТВИЯ СУДЬИ ---------- */
function newBracket(N,fill){
 const t=T(),ps=approved().slice();
 SP=buildSpec(N);SPfor=t.id;
 const m={};SP.spec.forEach(s=>m[s[0]]={a:null,b:null,sa:0,sb:0,st:'pending',tbl:null,at:null,h:null});
 if(fill){
  const ord=seedOrder(N);
  ps.forEach((e,i)=>{e.seed=i+1;e.w=0;e.l=0;e.place=null});
  for(let i=0;i<N/2;i++){
   m['W'+(i+1)].a=ps[ord[i*2]-1]?ps[ord[i*2]-1].p:'BYE';
   m['W'+(i+1)].b=ps[ord[i*2+1]-1]?ps[ord[i*2+1]-1].p:'BYE';
  }
 }else ps.forEach(e=>{e.seed=null;e.w=0;e.l=0;e.place=null});

function draw(mode){
 const t=T(),ps=approved().slice();
 if(ps.length<3)return toast('Нужно минимум 3 подтверждённых участника');
 if(mode==='random'){for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),x=ps[i];ps[i]=ps[j];ps[j]=x}}
 else ps.sort((a,b)=>(P(b.p).cat|0)-(P(a.p).cat|0));
 const N=sizeFor(ps.length);
 t.entries.sort((a,b)=>ps.indexOf(a)-ps.indexOf(b));
 const keep=ps.slice();
 SP=buildSpec(N);SPfor=t.id;
 const m={};SP.spec.forEach(s=>m[s[0]]={a:null,b:null,sa:0,sb:0,st:'pending',tbl:null,at:null,h:null});
 const ord=seedOrder(N);
 keep.forEach((e,i)=>{e.seed=i+1;e.w=0;e.l=0;e.place=null});
 for(let i=0;i<N/2;i++){
  m['W'+(i+1)].a=keep[ord[i*2]-1]?keep[ord[i*2]-1].p:'BYE';
  m['W'+(i+1)].b=keep[ord[i*2+1]-1]?keep[ord[i*2+1]-1].p:'BYE';
 }
 t.br={N,m};t.seq=0;t.status='drawn';
 resolveByes();
 feed(`Жеребьёвка: сетка на ${N}, ${keep.length} участников, посев ${mode==='random'?'случайный':'по статусам'}`);

}

 if(ew)ew.w=Math.max(0,(ew.w||0)-1); if(el)el.l=Math.max(0,(el.l||0)-1);

 const busy=ids().filter(i=>i!==id&&MM(i).st==='live').map(i=>MM(i).tbl);
 m.tbl=(m.ptbl&&busy.indexOf(m.ptbl)<0)?m.ptbl:null;

function places(){

 const loss={},out=[];

function matchCard(id){

  const p=P(pid);if(!p)return `<div class="m-s tbd"><span class="nm">—</span></div>`;
  const done=m.st==='done',win=done&&sc>other;

 };

function bsection(kind){
 const sp=spec(),cols=[];
 if(kind==='W'){
  for(let r=1;r<=sp.k;r++){const ms=sp.spec.filter(s=>s[1]==='W'&&s[2]===r).map(s=>s[0]);cols.push({h:labOf(ms[0]),ms})}
  cols.push({h:'Гранд-финал',ms:['GF']});
 }else{
  for(let r=1;r<=sp.lbR;r++){const ms=sp.spec.filter(s=>s[1]==='L'&&s[2]===r).map(s=>s[0]);if(ms.length)cols.push({h:labOf(ms[0]),ms})}
 }
 return `<div class="bwrap"><div class="bcanvas" data-sec="${kind}"><svg class="bsvg"></svg>
  ${cols.map(c=>`<div class="bcol"><div class="bcol-h">${c.h}</div><div class="bcol-in">${c.ms.map(matchCard).join('')}</div></div>`).join('')}</div></div>`;
}

   Сетка появится, когда организатор её сформирует.</div></div>`;
 let empty=0;ids().forEach(i=>{if(sp1(i)[1]==='W'&&sp1(i)[2]===1){if(!MM(i).a)empty++;if(!MM(i).b)empty++}});
 return `<div class="row wr" style="margin-bottom:12px;gap:12px">

  <div class="legend"><span><i style="background:var(--core)"></i>идёт</span><span><i style="background:var(--amber)"></i>победитель</span><span><i style="background:var(--surface-3)"></i>ожидает</span></div></div>
 ${ADMIN&&empty?`<div class="note" style="margin-bottom:12px;color:var(--amber-2)">Пустых мест в первом круге: ${empty}. Кликните по строке матча, чтобы поставить игрока.</div>`

 <div class="h-sec" style="margin:14px 0 8px">Верхняя сетка</div>${bsection('W')}
 <div class="h-sec" style="margin:20px 0 8px">Нижняя сетка · выбывание со второго поражения</div>${bsection('L')}`;

function drawLinks(){
 const t=T();if(!t||!t.br)return;
 document.querySelectorAll('.bcanvas').forEach(cv=>{
  const svg=cv.querySelector('.bsvg'),cr=cv.getBoundingClientRect();
  svg.setAttribute('width',cv.scrollWidth);svg.setAttribute('height',cv.scrollHeight);
  svg.setAttribute('viewBox','0 0 '+cv.scrollWidth+' '+cv.scrollHeight);
  let d='';
  spec().spec.forEach(s=>{[s[3],s[4]].forEach((src,i)=>{
   if(!src)return;const parts=src.split(':'),sm=parts[0],kind=parts[1];
   const from=cv.querySelector('[data-m="'+sm+'"]'),to=cv.querySelector('[data-m="'+s[0]+'"]');
   if(!from||!to)return;
   const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
   const x1=a.right-cr.left,y1=a.top-cr.top+a.height/2,x2=b.left-cr.left,y2=b.top-cr.top+(i?b.height*.72:b.height*.34);
   const mx=x1+(x2-x1)/2,mo=MM(sm),car=mo.st==='done'?(kind==='w'?winId(mo):losId(mo)):'';
   d+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" data-carrier="${car||''}"/>`;
  })});
  svg.innerHTML=d;
 });
 hotPaths();
}
function hotPaths(){
 document.querySelectorAll('.bsvg path').forEach(p=>p.classList.toggle('hot',!!S.hot&&p.dataset.carrier===S.hot));
 document.querySelectorAll('.m').forEach(n=>{const m=MM(n.dataset.m);n.classList.toggle('hot',!!S.hot&&(m.a===S.hot||m.b===S.hot))});
}

const numOr=(v,def)=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?def:n};
function saveCfg(){
 const t=T(),g=id=>{const n=$('#c-'+id);return n?n.value.trim():''};
 t.name=g('name')||t.name;t.sub=g('sub');t.disc=g('disc')||t.disc;t.venue=g('venue');t.dates=g('dates');
 t.fee=g('fee');t.prize=g('prize');t.video=g('video');t.vt=g('vt');
 t.race=Math.max(1,Math.min(15,Math.round(numOr(g('race'),t.race))));
 t.tables=Math.max(1,Math.min(12,Math.round(numOr(g('tables'),t.tables))));
 ST.pin=g('pin')||ST.pin;
 toast('Сохранено');save();render();
}
function saveCats(){
 const out=[];
 document.querySelectorAll('[data-catn]').forEach(n=>{
  const i=+n.dataset.catn,c=document.querySelector('[data-catc="'+i+'"]'),code=(n.value||'').trim();
  if(code)out.push({code,c:c?c.value:'#9BB4C7'})});
 if(!out.length)return toast('Нужен хотя бы один статус');
 ST.cats=out;
 ST.players.forEach(p=>{p.cat=Math.max(0,Math.min(out.length-1,p.cat|0))});
 toast('Статусы сохранены');save();render();
}

/* ---------- СУДЕЙСКИЙ ПЛАНШЕТ ---------- */
function openMatch(id){
 const t=T();
 if(!t||!t.br||!t.br.m[id])return;
 const m=MM(id),both=m.a&&m.b&&m.a!=='BYE'&&m.b!=='BYE';
 S.openM=id;
 $('#dr-k').textContent=id+' · '+labOf(id);
 $('#dr-t').textContent=both?short(P(m.a).name)+' — '+short(P(m.b).name):'Соперники определяются';
 const pips=n=>`<div class="pips">${Array.from({length:t.race},(_,i)=>`<span class="pip ${i<n?'f':''}"></span>`).join('')}</div>`;
 const row=(pid,sc,other,key)=>{
  if(!pid||pid==='BYE')return `<div class="score-row"><span class="dim">${pid==='BYE'?'свободный проход':tbdText(id,key)}</span></div>`;
  const p=P(pid),h=m.h&&m.h.to===pid?`<span class="chip" style="padding:1px 6px;font-size:10px;color:var(--amber-2)">фора +${m.h.n}</span>`:'';
  return `<div class="score-row ${sc>other?'lead':''}"><div style="flex:1;min-width:0">${pline(pid,[p.mid,p.club].filter(Boolean).join(' · '))}
    <div class="row" style="gap:8px;margin-top:7px">${catBadge(p,12)}<span class="num dim" style="font-size:11px">рейтинг ${RT(p)} · ${relOf(p)}%</span>${h}</div>${pips(sc)}</div>
   ${ADMIN&&m.st!=='done'?`<div class="row" style="gap:8px"><button class="sbtn" data-sc="${key}|-1" type="button">−</button>
     <span class="sval">${sc}</span><button class="sbtn" data-sc="${key}|1" type="button">+</button></div>`
    :`<span class="sval">${m.st==='pending'?'—':sc}</span>`}</div>`;
 };
 $('#dr-b').innerHTML=`<div class="row wr" style="gap:7px;margin-bottom:12px">
   <span class="chip ${m.st==='live'?'live':m.st==='done'?'ok':''}">${m.st==='live'?'<span class="dot"></span>стол '+m.tbl:m.st==='done'?(m.bye?'авто-проход':'завершён '+esc(m.at||'')):'ожидает вызова'}</span>
   <span class="chip">до ${t.race}</span><span class="chip st">${esc(t.disc)}</span>${both&&m.st!=='done'?`<span class="chip" title="Сколько рейтинга разыгрывается">на кону ${stake(m)}</span>`:''}${both&&m.st==='done'&&m.rated?`<span class="chip ok">рейтинг ±${m.rated.d}</span>`:''}</div>
  <div class="grid" style="gap:10px">${row(m.a,m.sa,m.sb,'a')}${row(m.b,m.sb,m.sa,'b')}</div>`;
 let foot='<button class="btn" data-x="1" type="button">Закрыть</button>';
 if(ADMIN&&both){
  if(m.st==='done'&&!m.bye)foot+='<button class="btn" data-act="undo" type="button">Отменить результат</button>';
  else if(m.st==='live'){const can=m.sa>=t.race||m.sb>=t.race;
   foot+=`<button class="btn ${can?'gold':''}" data-act="fin" type="button" ${can?'':'disabled'}>${can?'Завершить матч':'Счёт до '+t.race}</button>`}
  else if(m.st==='pending')foot+=`<button class="btn core" data-call="${id}" type="button">На стол…</button>`;
 }
 $('#dr-f').innerHTML=foot;
 $('#drawer').classList.add('on');$('#scrim').classList.add('on');
}
const closeDrawer=()=>{S.openM=null;$('#drawer').classList.remove('on');if(!$('#modal').classList.contains('on'))$('#scrim').classList.remove('on')};

/* ============================== РЕНДЕР ============================== */
const VIEWS={tours:vTours,tour:vTour,bracket:vBracket,board:vBoard,rating:vRating,people:vPeople,player:vPlayer,cfg:vCfg};
function shell(){
 document.getElementById('root').innerHTML=`<div class="app">
  <nav class="rail" id="rail"></nav>
  <header class="topbar"><div class="logo"></div><div class="wordmark">MATCHFLOW<b> OS</b></div>
   <div class="sepv" style="height:22px"></div>
   <button class="tsel" data-nav="tours" type="button"><span class="tname" id="tb-name"></span><span class="tmeta" id="tb-meta"></span></button>
   <div class="top-sp"></div><span class="sync ok" id="sync"><i></i>сохранено</span>
   <button class="btn sm" id="pinb" type="button">Судейская</button></header>
  <div class="judgebar" id="jbar"></div>
  <main class="main" id="main"><div class="wrap" id="view"></div></main></div>
 <div class="scrim" id="scrim"></div>
 <aside class="drawer" id="drawer" role="dialog" aria-label="Карточка матча">
  <div class="dr-h"><div style="flex:1;min-width:0"><div class="h-sec" id="dr-k">МАТЧ</div>
   <div style="font-family:var(--disp);font-size:15px;font-weight:600" id="dr-t">—</div></div>
   <button class="xb" data-x="1" type="button" aria-label="Закрыть">✕</button></div>
  <div class="dr-b" id="dr-b"></div><div class="dr-f" id="dr-f"></div></aside>
 <div class="modal" id="modal" role="dialog"><div class="md-h"><h3 style="flex:1;font-size:15px" id="md-t"></h3>
   <button class="xb" data-x="1" type="button" aria-label="Закрыть">✕</button></div><div class="md-b" id="md-b"></div></div>
 <div class="toast" id="toast"></div>`;
}
function render(){
 document.body.classList.toggle('adm',ADMIN);
 const t=T();
 $('#rail').innerHTML=NAV().map(([k,l])=>`<button class="navb ${k==='cfg'?'jd':''} ${S.view===k?'on':''}" data-nav="${k}" type="button">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg><span>${l}</span></button>`).join('')+'<div class="rail-sp"></div>';
 $('#tb-name').textContent=t?t.name:'—';
 $('#tb-meta').textContent=t?tsOf(t.status).ru:'';
 $('#pinb').textContent=ADMIN?'Выйти из судейской':'Судейская';
 $('#pinb').className='btn sm'+(ADMIN?' core':'');
 const jb=$('#jbar');
 if(ADMIN&&t){jb.innerHTML=`<span class="chip live"><span class="dot"></span>режим судьи</span>
   <span class="dim">заявок: <b style="color:var(--ink)">${pending().length}</b></span>
   <span class="dim">в игре: <b style="color:var(--ink)">${liveM().length}</b></span>
   <span class="dim">очередь: <b style="color:var(--ink)">${queueM().length}</b></span><span style="flex:1"></span>
   <span class="chip ${tsOf(t.status).chip}">${tsOf(t.status).ru}</span>
   ${t.br&&MM('GF').st==='done'&&t.status!=='done'?'<button class="btn sm gold" data-act="close" type="button">Закрыть турнир</button>':''}`}
 else jb.innerHTML='';
 $('#view').innerHTML=(VIEWS[S.view]||vTours)();
 setSync(SYNC);
 if(S.view==='bracket')requestAnimationFrame(drawLinks);
 if(S.view==='people')filterPeople();
 if(S.view==='rating')filterRating();
}
function go(v){S.view=v;S.hot=null;const m=$('#main');if(m)m.scrollTop=0;render()}

/* ---------- СОБЫТИЯ ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-nav],[data-m],[data-p],[data-call],[data-act],[data-x],[data-sc],[data-tour],[data-tq],[data-slot],[data-empty],#pinb,#r-go,#pin-go');
 if(!t)return;
 if(t.id==='pinb')return pinForm();
 if(t.id==='r-go')return addReg(t.dataset.auto==='1');
 if(t.id==='pin-go')return tryPin();
 if(t.dataset.x)return(closeModal(),closeDrawer());
 if(t.dataset.slot!==undefined&&t.dataset.slot!==''){const[mid,side,pid]=t.dataset.slot.split('|');closeModal();return setSlot(mid,side,pid||null)}
 if(t.dataset.empty&&ADMIN){const[mid,side]=t.dataset.empty.split('|');
   const m=MM(mid);if(m.st!=='pending')return openMatch(mid);
   return slotForm(mid,side)}
 if(t.dataset.sc){const parts=t.dataset.sc.split('|'),m=MM(S.openM),race=T().race;
  if(parts[0]==='a')m.sa=Math.max(0,Math.min(race,m.sa+ +parts[1]));else m.sb=Math.max(0,Math.min(race,m.sb+ +parts[1]));
  save();openMatch(S.openM);const sc=$('#main').scrollTop;render();$('#main').scrollTop=sc;return}
 if(t.dataset.call)return callForm(t.dataset.call);
 if(t.dataset.tour){ST.cur=t.dataset.tour;S.openM=null;save();return go('tour')}
 if(t.dataset.tq!==undefined&&t.dataset.tq!==null&&t.hasAttribute('data-tq')){S.tq=t.dataset.tq;return render()}
 if(t.dataset.nav)return go(t.dataset.nav);
 if(t.dataset.p){S.player=t.dataset.p;closeDrawer();return go('player')}
 if(t.dataset.m)return openMatch(t.dataset.m);
 if(t.dataset.act)return act(t.dataset.act);
});
document.addEventListener('change',e=>{
 const s=e.target.closest('[data-cat]');if(!s)return;
 const p=P(s.dataset.cat);if(!p)return;
 p.cat=+s.value||0;toast('Статус: '+CATS()[p.cat].code);save();
 const row=s.closest('tr');if(row){const av=row.querySelector('.av'),col=CATS()[p.cat].c;
  if(av){av.style.background=col+'22';av.style.color=col;av.style.borderColor=col+'44'}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;filterPeople()}
 if(e.target.id==='rq'){S.rq=e.target.value;filterRating()}});
function act(a){
 const i=a.indexOf(':'),k=i<0?a:a.slice(0,i),arg=i<0?'':a.slice(i+1);
 const t=T();
 if(k==='reg')return regForm(false);
 if(k==='addp')return regForm(true);
 if(k==='swap')return swapForm();
 if(k==='draw')return draw(arg||'status');
 if(k==='empty'){const n=+($('#emptyN')?$('#emptyN').value:16)||16;return emptyBracket(n)}
 if(k==='rebuild')return confirmBox('Пересобрать сетку?','Текущая сетка и все результаты этого турнира будут стёрты. Состав останется.',()=>{
   t.br=null;t.seq=0;t.status='closed';feed('Сетка сброшена судьёй');toast('Сетка сброшена');save();go('tour')});
 if(k==='close')return closeTour();
 if(k==='st'){t.status=arg;feed('Статус турнира: '+tsOf(arg).ru);toast(tsOf(arg).ru);save();return render()}
 if(k==='pub'){t.pub=!t.pub;toast(t.pub?'Опубликован':'Скрыт');save();return render()}
 if(k==='newtour')return newTour();
 if(k==='demo')return confirmBox('Загрузить демо-набор?','Текущие турниры, составы и сетки будут заменены демонстрационными данными: VENOM OPEN, DRY LEAF + CITADEL, категории Billiarder. База игроков тоже перезапишется.',()=>{
   try{ST=migrate(JSON.parse(document.getElementById('app-state').textContent));toast('Демо-набор загружен');save();go('tours')}
   catch(e){toast('Не удалось прочитать демо-набор')}});
 if(k==='savecfg')return saveCfg();
 if(k==='savecats')return saveCats();
 if(k==='catadd'){ST.cats=CATS().slice();ST.cats.push({code:'НОВЫЙ СТАТУС',c:'#9BB4C7'});save();return render()}
 if(k==='catdel'){const c=CATS().slice();if(c.length<2)return toast('Нужен хотя бы один статус');
   c.splice(+arg,1);ST.cats=c;ST.players.forEach(p=>{p.cat=Math.max(0,Math.min(c.length-1,p.cat|0))});save();return render()}
 if(k==='catup'){const c=CATS().slice(),j=+arg;if(j<1)return;
   const tmp=c[j-1];c[j-1]=c[j];c[j]=tmp;ST.cats=c;
   ST.players.forEach(p=>{if((p.cat|0)===j)p.cat=j-1;else if((p.cat|0)===j-1)p.cat=j});save();return render()}
 if(k==='fin')return finish(S.openM);
 if(k==='undo')return undo(S.openM);
 if(k==='edit')return editForm(arg);
 if(k==='ok'){const e=ent(arg);if(e){e.st='ok';const p=P(arg);ensureMid(p);feed(`<b>${esc(p.name)}</b> в составе · ${p.mid}`);toast('Принят · '+p.mid);save();render()}return}
 if(k==='no'){const e=ent(arg);if(e){e.st='no';toast('Отклонён');save();render()}return}
 if(k==='back'){const e=ent(arg);if(e){e.st='new';toast('Вернул в заявки');save();render()}return}
 if(k==='join'){const p=P(arg);if(p){ensureMid(p);t.entries.push({p:arg,st:'ok',seed:null,w:0,l:0,place:null});
   feed(`<b>${esc(p.name)}</b> добавлен в состав`);toast('Добавлен');save();render()}return}
 if(k==='del'){const p=P(arg);if(!p)return;
   confirmBox('Удалить игрока?',p.name+' будет удалён из базы и из всех составов.',()=>{
    ST.players=ST.players.filter(x=>x.id!==arg);
    ST.tours.forEach(tt=>{tt.entries=tt.entries.filter(e=>e.p!==arg);
     if(tt.br)Object.keys(tt.br.m).forEach(kk=>{const m=tt.br.m[kk];if(m.a===arg)m.a=null;if(m.b===arg)m.b=null})});
    toast('Удалён');save();go(S.view==='player'?'people':S.view)});return}
 if(k==='wipe')return confirmBox('Удалить всё?','Все игроки, заявки, сетки и турниры будут стёрты. Отменить нельзя.',()=>{
   ST.players=[];ST.tours=[{id:'t1',name:'Новый турнир',sub:'',disc:'Вільна піраміда',venue:'',dates:'',fee:'',prize:'',
    race:5,tables:4,video:'',status:'reg',pub:true,entries:[],br:null,seq:0,feed:[{t:now(),txt:'Данные очищены'}]}];
   ST.cur='t1';ST.midSeq=0;ST.arch=[];toast('Готово');save();go('tour')});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}
 if(e.key==='Enter'&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.m)document.activeElement.click()});
document.addEventListener('mouseover',e=>{if(S.view!=='bracket')return;
 const s=e.target.closest('[data-pid]'),id=s?s.dataset.pid:null;
 if(id!==S.hot){S.hot=id;hotPaths()}});
window.addEventListener('resize',()=>{if(S.view==='bracket')drawLinks()});

/* ---------- СТАРТ ---------- */
shell();
document.body.classList.toggle('adm',ADMIN);
$('#scrim').addEventListener('click',()=>{closeModal();closeDrawer()});
S.view=T()&&T().status==='running'?'tour':'tours';
render();
(async function boot(){
 try{if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function')CAP=await claude.use('artifact')}catch(e){CAP=null}
 if(CAP){MODE='artifact';setSync('ok');return}
 try{
  const r=await fetch('/api/state',{cache:'no-store'});
  if(r.ok){const j=await r.json();MODE='server';
   if(j&&j.state){ST=migrate(j.state);REV=j.rev||0}
   if(PIN){const c=await api('/api/state',{method:'POST',body:JSON.stringify({check:1})});
    if(!c.ok){PIN='';ADMIN=false;sessionStorage.removeItem('mfos-adm');sessionStorage.removeItem('mfos-pin')}}
   setSync('ok');render();startPoll();return}
 }catch(e){}
 MODE='local';LOCAL=true;
 try{const ls=localStorage.getItem('mfos');if(ls){const o=JSON.parse(ls);
  if(o&&o.players&&o.build===ST.build)ST=migrate(o);
  else if(o&&o.players)localStorage.removeItem('mfos')}}catch(e){}
 setSync('local');render();
})();
</script>
