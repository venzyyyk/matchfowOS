<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchFlow OS · OBS Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
:root{
  --core:#FF7A1A; --amber:#F5902B; --amber-2:#FFB86B; --gold:#E8C56A;
  --ink:#F2ECE6; --ink-2:#C9BEB4; --ink-3:#8A8078;
  --panel:rgba(12,10,9,.94); --panel-2:rgba(20,17,16,.96);
  --mono:"JetBrains Mono",monospace; --disp:"Unbounded",sans-serif; --body:"Golos Text",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
/* фон по умолчанию прозрачный — OBS Browser Source сам даёт альфу.
   ?bg=green → хромакей, если нужен ключ по зелёному */
body{background:transparent;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body.chroma{background:#00B140}
.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 0 46px}
/* сам скорборд — нижняя треть */
.board{width:min(1120px,94vw);opacity:0;transform:translateY(24px);transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .4s cubic-bezier(.2,.8,.2,1)}
.board.show{opacity:1;transform:none}
.meta{display:flex;align-items:center;gap:10px;padding:0 6px 8px;font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-2);text-shadow:0 2px 12px rgba(0,0,0,.8)}
.meta .tag{background:var(--core);color:#1b0a02;padding:2px 10px;border-radius:999px;font-size:12px;letter-spacing:.08em}
.meta .live{display:flex;align-items:center;gap:6px;color:#fff}
.meta .live i{width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 10px #ff3b3b;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.35}}
.plate{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,214,170,.12)}
.pl{background:var(--panel);display:flex;align-items:center;gap:16px;padding:18px 22px;min-width:0}
.pl.r{flex-direction:row-reverse;text-align:right}
.pl.lead.l{background:linear-gradient(90deg,rgba(245,144,43,.34),var(--panel) 72%)}
.pl.lead.r{background:linear-gradient(270deg,rgba(245,144,43,.34),var(--panel) 72%)}
.av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:20px;flex:none}
.who{min-width:0}
.nm{font-family:var(--disp);font-weight:600;font-size:25px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{background:var(--panel-2);display:flex;align-items:center;justify-content:center;gap:16px;padding:0 30px;min-width:200px}
.num{font-family:var(--mono);font-weight:700;font-size:58px;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s}
.num.lead{color:var(--amber-2);text-shadow:0 0 22px rgba(245,144,43,.5)}
.colon{font-family:var(--mono);font-weight:700;font-size:40px;color:var(--ink-3);transform:translateY(-3px)}
.foot{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px;padding:0 6px;font-size:13px;color:var(--ink-2);text-shadow:0 2px 10px rgba(0,0,0,.8)}
.foot .seg{display:flex;align-items:center;gap:6px}
.foot b{color:var(--ink);font-family:var(--mono);font-weight:700}
/* мини-таблица группы под табло */
.mini{margin-top:10px;background:var(--panel);border-radius:12px;padding:10px 14px;box-shadow:0 0 0 1px rgba(255,214,170,.1)}
.mini-h{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.mrow{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.mrow .r{width:18px;color:var(--ink-3);font-family:var(--mono);font-weight:700;text-align:center}
.mrow.q .r{color:var(--gold)}
.mrow .mn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mrow .w{font-family:var(--mono);font-weight:700;color:var(--amber-2)}
.mrow.q .mn{color:#fff}
.idle{opacity:0;transition:opacity .4s}
.idle.show{opacity:1}
.idle-box{background:var(--panel);border-radius:14px;padding:16px 26px;font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);box-shadow:0 0 0 1px rgba(255,214,170,.1)}
/* ?size=sm|lg масштаб всего табло под разные сцены */
body.sm .board{width:min(820px,90vw)} body.sm .num{font-size:44px} body.sm .nm{font-size:20px} body.sm .av{width:44px;height:44px}
body.lg .board{width:min(1320px,96vw)} body.lg .num{font-size:72px} body.lg .nm{font-size:30px}
</style>
</head>
<body>
<div class="stage">
  <div class="board" id="board"></div>
  <div class="idle" id="idle"><div class="idle-box" id="idle-t">MATCHFLOW OS</div></div>
</div>

<script src="/lib/groups.js"></script>
<script src="/lib/mf-api.js"></script>
<script>
'use strict';
var $=function(s){return document.querySelector(s);};
var G=window.MFGroups, Api=window.MFApi;
var ST=null, REV=-1;

/* параметры из URL */
var Q=new URLSearchParams(location.search);
if(Q.get('bg')==='green'||Q.get('chroma')==='1')document.body.classList.add('chroma');
if(Q.get('size')==='sm')document.body.classList.add('sm');
if(Q.get('size')==='lg')document.body.classList.add('lg');
var MINI=Q.get('table')!=='0'&&Q.get('mini')!=='0';   /* показывать мини-таблицу группы */
var INTERVAL=Math.max(600, +Q.get('int')||1500);       /* частота опроса, мс */

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function P(id){return (ST&&ST.players||[]).find(function(p){return p.id===id;})||null;}
function initials(n){var pr=String(n||'').trim().split(/\s+/);return((pr[0]||'')[0]||'')+((pr[1]||'')[0]||'');}
function fullName(n){return String(n||'').trim();}
function cats(){return (ST&&ST.cats)||[];}
function catOf(p){var c=cats();return c[(p&&p.cat)|0]||{c:'#9BB4C7',code:''};}

function boot(){
  Api.read().then(function(d){ apply(d,true); paint(); }).catch(function(){ paint(); });
  Api.poll(function(d){ apply(d,true); paint(); },{ interval:INTERVAL, rev:REV, onError:function(){} });
}
function apply(d,force){
  if(!d||typeof d.rev!=='number')return;
  if(!force&&d.rev<=REV)return;
  if(d.state){ST=d.state;REV=d.rev;}
  else REV=d.rev;
}

function paint(){
  var s=ST&&ST.groups?ST.groups:null;
  var lm=s?G.liveMatch(s):null;
  var board=$('#board'), idle=$('#idle');
  if(!lm||!lm.match){
    board.classList.remove('show');
    idle.classList.add('show');
    $('#idle-t').textContent=(ST&&(tourName()))||'MATCHFLOW OS';
    return;
  }
  idle.classList.remove('show');
  var g=lm.group, m=lm.match;
  var pa=P(m.a)||{name:'—'}, pb=P(m.b)||{name:'—'};
  var ca=catOf(pa).c, cb=catOf(pb).c;
  var leadA=m.sa>m.sb, leadB=m.sb>m.sa;
  var race=(s.race|0);

  board.innerHTML=
    '<div class="meta">'+
      '<span class="tag">'+esc(g.name)+'</span>'+
      '<span class="live"><i></i>LIVE</span>'+
      '<span style="color:var(--ink-3);font-size:12px;letter-spacing:.1em">'+esc(tourName())+'</span>'+
    '</div>'+
    '<div class="plate">'+
      side('l',pa,ca,leadA)+
      '<div class="sc"><span class="num '+(leadA?'lead':'')+'">'+(m.sa|0)+'</span><span class="colon">:</span><span class="num '+(leadB?'lead':'')+'">'+(m.sb|0)+'</span></div>'+
      side('r',pb,cb,leadB)+
    '</div>'+
    '<div class="foot">'+
      (race>0?'<span class="seg">до <b>'+race+'</b> побед</span>':'<span class="seg">один сет</span>')+
      '<span class="seg">проходят по <b>'+s.advance+'</b></span>'+
    '</div>'+
    (MINI?mini(s,g):'');
  requestAnimationFrame(function(){ board.classList.add('show'); });
}

function side(sideCls,p,c,lead){
  return '<div class="pl '+sideCls+(lead?' lead':'')+'">'+
    '<span class="av" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'55">'+esc(initials(p.name))+'</span>'+
    '<span class="who"><div class="nm">'+esc(fullName(p.name))+'</div>'+
    (p.club||p.city?'<div class="sub">'+esc([p.club,p.city].filter(Boolean).join(' · '))+'</div>':'')+'</span>'+
  '</div>';
}

function mini(s,g){
  var st=G.standings(s,g).slice(0,Math.max(4,s.advance+1));
  var rows=st.map(function(r,i){ var p=P(r.pid)||{name:'—'};
    return '<div class="mrow '+(r.adv?'q':'')+'"><span class="r">'+(i+1)+'</span><span class="mn">'+esc(shortName(p.name))+'</span><span class="w">'+r.w+'</span></div>';
  }).join('');
  return '<div class="mini"><div class="mini-h">'+esc(g.name)+' · таблица</div>'+rows+'</div>';
}
function shortName(n){var pr=String(n||'').trim().split(/\s+/);return pr.length>1?pr[0]+' '+pr[1][0]+'.':n;}

function tourName(){
  if(!ST)return '';
  if(ST.t&&ST.t.name)return ST.t.name;
  if(Array.isArray(ST.tours)){var t=ST.tours.find(function(x){return x.id===ST.cur;})||ST.tours[0];if(t)return t.name;}
  return '';
}

boot();
</script>
</body>
</html>
