  --ground:#070607; --ground-2:#0A0909; --surface:#100E0E; --surface-2:#171414; --surface-3:#201C1B;
  --line:rgba(255,214,170,.10); --line-2:rgba(255,214,170,.20);
  --ink:#F2ECE6; --ink-2:#AEA49C; --ink-3:#71675F;
  --core:#FF7A1A; --core-2:#FFB067; --core-soft:rgba(255,122,26,.14);
  --amber:#F5902B; --amber-2:#FFB86B; --amber-dim:rgba(245,144,43,.14);
  --steel:#9BB4C7; --steel-dim:rgba(155,180,199,.13);
  --gold:#E8C56A; --gold-dim:rgba(232,197,106,.13);
  --ok:#3FCF8E; --ok-dim:rgba(63,207,142,.13);
  --bad:#FF5757; --bad-dim:rgba(255,87,87,.13);

  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --disp:"Unbounded","Golos Text",system-ui,sans-serif;

  --sh:0 18px 50px -24px rgba(0,0,0,.92);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,214,170,.14);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,214,170,.26)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.h-page{font-size:22px;line-height:1.15}
.h-sec{font-size:11.5px;font-family:var(--disp);font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--ink-2)} .dim{color:var(--ink-3)}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--top) 1fr;height:100dvh}
.rail{grid-row:1/3;border-right:1px solid var(--line);background:var(--ground-2);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:20}

}

/* ---------- ГЕНЕРАТОР СЕТКИ (double elimination, N=4..32) ---------- */
function buildSpec(N){
 const k=Math.round(Math.log2(N)),spec=[],wb=[];let wi=1;
 for(let r=1;r<=k;r++){
  const cnt=N>>r,idsx=[];
  for(let i=0;i<cnt;i++){const id='W'+(wi++);idsx.push(id);
   spec.push(r===1?[id,'W',1,null,null]:[id,'W',r,wb[r-2][i*2]+':w',wb[r-2][i*2+1]+':w'])}
  wb.push(idsx);
 }
 let li=1,lr=1,prev=[];
 {const cnt=N>>2,idsx=[];
  for(let i=0;i<cnt;i++){const id='L'+(li++);idsx.push(id);spec.push([id,'L',lr,wb[0][i*2]+':l',wb[0][i*2+1]+':l'])}
  prev=idsx;lr++}
 for(let t=2;t<=k;t++){
  const src=wb[t-1].slice().reverse(),idsx=[];
  for(let i=0;i<prev.length;i++){const id='L'+(li++);idsx.push(id);spec.push([id,'L',lr,prev[i]+':w',src[i]+':l'])}
  prev=idsx;lr++;
  if(prev.length>1){const i2=[];
   for(let i=0;i<prev.length/2;i++){const id='L'+(li++);i2.push(id);spec.push([id,'L',lr,prev[i*2]+':w',prev[i*2+1]+':w'])}
   prev=i2;lr++}
 }
 spec.push(['GF','F',1,wb[k-1][0]+':w',prev[0]+':w']);
 return {spec,k,N,lbR:lr-1};
}
let SP=null;
function spec(){if(!ST.br)return null;if(!SP||SP.N!==ST.br.N)SP=buildSpec(ST.br.N);return SP}
const ids=()=>spec()?spec().spec.map(s=>s[0]):[];
const sp1=id=>spec().spec.find(s=>s[0]===id);
const MM=id=>ST.br.m[id];
function labOf(id){
 const s=sp1(id),N=ST.br.N;
 if(s[1]==='F')return 'Гранд-финал';
 if(s[1]==='W'){const r=N>>s[2];return r===1?'Финал верхней':r===2?'Полуфинал':'1/'+r+' финала'}
 return s[2]===spec().lbR?'Финал нижней':'Нижняя · R'+s[2];
}
function labGen(id){
 const s=sp1(id),N=ST.br.N;
 if(s[1]==='F')return 'гранд-финала';
 if(s[1]==='W'){const r=N>>s[2];return r===1?'финала верхней':r===2?'полуфинала':'1/'+r+' финала'}
 return s[2]===spec().lbR?'финала нижней':'нижней R'+s[2];
}
function seedOrder(N){let a=[1,2];while(a.length<N){const n=a.length*2,b=[];a.forEach(s=>{b.push(s);b.push(n+1-s)});a=b}return a}
const sizeFor=n=>n<=4?4:n<=8?8:n<=16?16:32;
const winId=m=>m.st==='done'?(m.sa>m.sb?m.a:m.b):null;
const losId=m=>m.st==='done'?(m.sa>m.sb?m.b:m.a):null;
function feed(txt){ST.feed.unshift({t:now(),txt});if(ST.feed.length>60)ST.feed.pop()}

function advance(id){
 const m=MM(id),w=winId(m),l=losId(m);
 spec().spec.forEach(s=>{const t=ST.br.m[s[0]];
  if(s[3]===id+':w')t.a=w; if(s[4]===id+':w')t.b=w;
  if(s[3]===id+':l')t.a=l; if(s[4]===id+':l')t.b=l});
}
function resolveByes(){
 let ch=true,g=0;
 while(ch&&g++<40){ch=false;
  ids().forEach(id=>{const m=MM(id);
   if(m.st!=='pending'||!m.a||!m.b)return;
   if(m.a==='BYE'&&m.b==='BYE'){m.st='done';m.sa=0;m.sb=0;m.bye=1;advance(id);ch=true;return}
   if(m.a==='BYE'||m.b==='BYE'){m.st='done';m.bye=1;m.sa=m.a==='BYE'?0:ST.t.race;m.sb=m.b==='BYE'?0:ST.t.race;advance(id);ch=true}});
 }
}

/* ---------- ДЕЙСТВИЯ СУДЬИ ---------- */
function draw(mode){
 const ps=approved().slice();
 if(ps.length<3)return toast('Нужно минимум 3 подтверждённых участника');
 if(mode==='random'){for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),t=ps[i];ps[i]=ps[j];ps[j]=t}}
 else ps.sort((a,b)=>(b.cat|0)-(a.cat|0));
 const N=sizeFor(ps.length);
 ps.forEach((p,i)=>{p.seed=i+1;p.w=0;p.l=0;p.place=null});
 ST.players.filter(p=>p.st!=='ok').forEach(p=>{p.seed=null});
 SP=buildSpec(N);
 const m={};SP.spec.forEach(s=>m[s[0]]={a:null,b:null,sa:0,sb:0,st:'pending',tbl:null,at:null});
 const ord=seedOrder(N);
 for(let i=0;i<N/2;i++){
  m['W'+(i+1)].a=ps[ord[i*2]-1]?ps[ord[i*2]-1].id:'BYE';
  m['W'+(i+1)].b=ps[ord[i*2+1]-1]?ps[ord[i*2+1]-1].id:'BYE';
 }
 ST.br={N,m};ST.seq=0;ST.t.status='live';
 resolveByes();
 feed(`Жеребьёвка: сетка на ${N}, ${ps.length} участников, посев ${mode==='random'?'случайный':'по статусам'}`);
 toast('Сетка создана');save();go('bracket');
}
function callTable(id,tbl){
 const m=MM(id);
 if(!m.a||!m.b)return toast('Соперники ещё не определены');
 if(!tbl)return toast('Нет свободных столов');
 m.st='live';m.tbl=+tbl;m.sa=0;m.sb=0;m.at=now();
 feed(`Стол ${tbl}: <b>${esc(short(P(m.a).name))}</b> — <b>${esc(short(P(m.b).name))}</b> · ${labOf(id)}`);
 toast(`Матч ${id} на столе ${tbl}`);save();render();if(S.openM===id)openMatch(id);
}
function finish(id){
 const m=MM(id);if(m.st==='done')return;
 if(m.sa===m.sb)return toast('Ничьих не бывает');
 m.st='done';m.at=now();m.tbl=null;m.n=++ST.seq;
 const w=winId(m),l=losId(m);
 P(w).w=(P(w).w||0)+1;P(l).l=(P(l).l||0)+1;
 advance(id);
 feed(`<b>${esc(short(P(w).name))}</b> обыграл ${esc(short(P(l).name))} — <span class="num">${m.sa}:${m.sb}</span> · ${labOf(id)}`);
 toast(`Результат внесён: ${short(P(w).name)} ${m.sa}:${m.sb}`);
 save();render();openMatch(id);
}
function undo(id){
 const m=MM(id);if(m.st!=='done'||m.bye)return;
 const w=winId(m),l=losId(m);
 if(P(w))P(w).w=Math.max(0,(P(w).w||0)-1);
 if(P(l))P(l).l=Math.max(0,(P(l).l||0)-1);
 m.st='live';m.tbl=null;
 spec().spec.forEach(s=>{const t=ST.br.m[s[0]];
  if(s[3]&&s[3].split(':')[0]===id)t.a=null;
  if(s[4]&&s[4].split(':')[0]===id)t.b=null});
 feed(`Результат матча ${id} отменён судьёй`);
 toast('Результат отменён');save();render();openMatch(id);
}
function places(){
 const done=ids().map(i=>({id:i,m:MM(i)})).filter(x=>x.m.st==='done'&&x.m.n).sort((a,b)=>a.m.n-b.m.n);
 const loss={},out=[];
 done.forEach(x=>{const l=losId(x.m);if(!l||l==='BYE')return;loss[l]=(loss[l]||0)+1;if(loss[l]>=2)out.push(l)});
 const gf=MM('GF'),first=winId(gf),second=losId(gf);
 return [first,second].filter(Boolean).concat(out.filter(x=>x!==first&&x!==second).reverse());
}
function closeTour(){
 if(!ST.br||MM('GF').st!=='done')return toast('Гранд-финал ещё не сыгран');
 const pl=places();
 pl.forEach((id,i)=>{const p=P(id);if(p)p.place=i+1});
 ST.t.status='done';ST.arch=ST.arch||[];
 ST.arch.unshift({name:ST.t.name,date:ST.t.dates,podium:pl.slice(0,3).map(id=>P(id)?P(id).name:'—')});
 feed(`Турнир завершён. Победитель — <b>${esc(P(pl[0])?P(pl[0]).name:'—')}</b>`);
 toast('Турнир закрыт');save();go('tour');
}
function newTour(){
 ST.players.forEach(p=>{p.w=0;p.l=0;p.seed=null;p.place=null});
 ST.br=null;ST.seq=0;ST.t.status='reg';ST.feed=[];
 feed('Открыт новый турнир — регистрация запущена');
 toast('Новый турнир создан');save();go('tour');
}

/* ---------- СЕТКА ---------- */
function bsection(kind){
 const sp=spec(),cols=[];
 if(kind==='W'){
  for(let r=1;r<=sp.k;r++){const ms=sp.spec.filter(s=>s[1]==='W'&&s[2]===r).map(s=>s[0]);cols.push({h:labOf(ms[0]),ms})}
  cols.push({h:'Гранд-финал',ms:['GF']});
 }else{
  for(let r=1;r<=sp.lbR;r++){const ms=sp.spec.filter(s=>s[1]==='L'&&s[2]===r).map(s=>s[0]);if(ms.length)cols.push({h:labOf(ms[0]),ms})}
 }
 return `<div class="bwrap"><div class="bcanvas" data-sec="${kind}"><svg class="bsvg"></svg>
  ${cols.map(c=>`<div class="bcol"><div class="bcol-h">${c.h}</div><div class="bcol-in">${c.ms.map(matchCard).join('')}</div></div>`).join('')}</div></div>`;
}
function vBracket(){
 if(!ST.br)return `<div class="card"><div class="empty" style="padding:60px 20px">
   <div class="logo md" style="margin:0 auto 16px;opacity:.5"></div>
   Сетка появится после жеребьёвки.${ADMIN?' Проведите её на вкладке «Турнир».':''}</div></div>`;
 return `<div class="row wr" style="margin-bottom:12px;gap:12px">
  <div><div class="h-sec">Турнирная сетка</div><h1 class="h-page" style="margin-top:5px">Двойное выбывание · ${ST.br.N}</h1></div><span class="sp"></span>
  <div class="legend"><span><i style="background:var(--core)"></i>идёт</span><span><i style="background:var(--amber)"></i>победитель</span><span><i style="background:var(--surface-3)"></i>ожидает</span></div></div>
 <div class="note" style="margin-bottom:12px">Наведите курсор на фамилию — подсветится весь путь игрока по сетке.${ADMIN?' Клик по матчу открывает судейский планшет.':''}</div>
 <div class="h-sec" style="margin:14px 0 8px">Верхняя сетка</div>${bsection('W')}
 <div class="h-sec" style="margin:20px 0 8px">Нижняя сетка · выбывание со второго поражения</div>${bsection('L')}`;
}
function drawLinks(){
 if(!ST.br)return;
 document.querySelectorAll('.bcanvas').forEach(cv=>{
  const svg=cv.querySelector('.bsvg'),cr=cv.getBoundingClientRect();
  svg.setAttribute('width',cv.scrollWidth);svg.setAttribute('height',cv.scrollHeight);
  svg.setAttribute('viewBox','0 0 '+cv.scrollWidth+' '+cv.scrollHeight);
  let d='';
  spec().spec.forEach(s=>{[s[3],s[4]].forEach((src,i)=>{
   if(!src)return;const parts=src.split(':'),sm=parts[0],kind=parts[1];
   const from=cv.querySelector('[data-m="'+sm+'"]'),to=cv.querySelector('[data-m="'+s[0]+'"]');
   if(!from||!to)return;
   const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
   const x1=a.right-cr.left,y1=a.top-cr.top+a.height/2,x2=b.left-cr.left,y2=b.top-cr.top+(i?b.height*.72:b.height*.34);
   const mx=x1+(x2-x1)/2,mo=MM(sm),car=mo.st==='done'?(kind==='w'?winId(mo):losId(mo)):'';
   d+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" data-carrier="${car||''}"/>`;
  })});
  svg.innerHTML=d;
 });
 hotPaths();
}
function hotPaths(){
 document.querySelectorAll('.bsvg path').forEach(p=>p.classList.toggle('hot',!!S.hot&&p.dataset.carrier===S.hot));
 document.querySelectorAll('.m').forEach(n=>{const m=MM(n.dataset.m);n.classList.toggle('hot',!!S.hot&&(m.a===S.hot||m.b===S.hot))});
}

 <div class="split"><div class="grid">
  <div class="card"><div class="card-h"><span class="h-sec">Карточка турнира</span></div><div class="card-b"><div class="grid" style="gap:12px">
   ${f('name','Название',T.name)}
   <div class="f2">${f('sub','Подзаголовок',T.sub||'')}${f('disc','Дисциплина',T.disc)}</div>
   <div class="f2">${f('venue','Место',T.venue||'')}${f('dates','Даты',T.dates||'')}</div>
   <div class="f2">${f('fee','Взнос',T.fee||'')}${f('prize','Призовой фонд',T.prize||'')}</div>
   <div class="f2">${f('race','До скольких побед',T.race,'number')}${f('tables','Столов',T.tables,'number')}</div>
   ${f('pin','Код судьи',ST.pin)}
   <button class="btn pri" data-act="savecfg" type="button">Сохранить</button></div></div></div>
  <div class="card"><div class="card-h"><span class="h-sec">Статусы игроков</span><span class="sp"></span>
    <button class="btn sm" data-act="catadd" type="button">+ Добавить</button></div><div class="card-b">
   <div class="note" style="margin-bottom:12px">Сверху вниз — от слабейшего к сильнейшему. Порядок используется только для посева «по статусам».</div>
   <div class="grid" style="gap:8px">${CATS().map((c,i)=>`<div class="row" style="gap:8px">
     <input type="color" value="${c.c}" data-catc="${i}" style="width:34px;height:34px;padding:2px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer">
     <input class="inp" value="${esc(c.code)}" data-catn="${i}" style="flex:1">
     <button class="btn sm" data-act="catup:${i}" type="button" ${i===0?'disabled':''}>↑</button>
     <button class="btn sm bad" data-act="catdel:${i}" type="button" ${CATS().length<2?'disabled':''}>✕</button></div>`).join('')}</div>
   <button class="btn" style="width:100%;margin-top:12px" data-act="savecats" type="button">Сохранить статусы</button></div></div>
 </div>
 <div class="grid">
  <div class="card"><div class="card-h"><span class="h-sec">Управление турниром</span></div><div class="card-b">
   <div class="note" style="margin-bottom:12px">Статус: <b>${T.status==='reg'?'регистрация':T.status==='live'?'идёт':'завершён'}</b>.</div>
   <div class="grid" style="gap:8px">
    ${T.status==='live'?'<button class="btn" data-act="close" type="button">Закрыть турнир и расставить места</button>':''}
    <button class="btn" data-act="new" type="button">Новый турнир (сбросить сетку)</button>
    <button class="btn bad" data-act="wipe" type="button">Удалить всех игроков и данные</button></div></div></div>
  <div class="card"><div class="card-h"><span class="h-sec">Как это хранится</span></div><div class="card-b">
   <div class="note">Базы нет: всё живёт прямо в этой странице и сохраняется при каждом действии судьи. Кто открыл ссылку — видит тот же турнир. Менять что-либо может только тот, у кого есть доступ на редактирование.</div></div></div>
 </div></div>`;
}
const numOr=(v,def)=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?def:n};
function saveCfg(){
 const g=id=>{const n=$('#c-'+id);return n?n.value.trim():''};
 ST.t.name=g('name')||ST.t.name;ST.t.sub=g('sub');ST.t.disc=g('disc')||ST.t.disc;ST.t.venue=g('venue');ST.t.dates=g('dates');
 ST.t.fee=g('fee');ST.t.prize=g('prize');
 ST.t.race=Math.max(1,Math.min(15,Math.round(numOr(g('race'),ST.t.race))));
 ST.t.tables=Math.max(1,Math.min(12,Math.round(numOr(g('tables'),ST.t.tables))));
 ST.pin=g('pin')||ST.pin;
 toast('Настройки сохранены');save();render();
}
function saveCats(){
 const out=[];
 document.querySelectorAll('[data-catn]').forEach(n=>{
  const i=+n.dataset.catn,c=document.querySelector('[data-catc="'+i+'"]'),code=(n.value||'').trim();
  if(code)out.push({code,c:c?c.value:'#9BB4C7'})});
 if(!out.length)return toast('Нужен хотя бы один статус');
 ST.cats=out;
 ST.players.forEach(p=>{p.cat=Math.max(0,Math.min(out.length-1,p.cat|0))});
 toast('Статусы сохранены');save();render();
}

/* ---------- СУДЕЙСКИЙ ПЛАНШЕТ ---------- */
function openMatch(id){
 if(!ST.br||!MM(id))return;
 const m=MM(id),both=m.a&&m.b&&m.a!=='BYE'&&m.b!=='BYE';
 S.openM=id;
 $('#dr-k').textContent=id+' · '+labOf(id);
 $('#dr-t').textContent=both?short(P(m.a).name)+' — '+short(P(m.b).name):'Соперники определяются';
 const pips=n=>`<div class="pips">${Array.from({length:ST.t.race},(_,i)=>`<span class="pip ${i<n?'f':''}"></span>`).join('')}</div>`;
 const row=(pid,sc,other,key)=>{
  if(!pid||pid==='BYE')return `<div class="score-row"><span class="dim">${pid==='BYE'?'свободный проход':tbdText(id,key)}</span></div>`;
  const p=P(pid);
  return `<div class="score-row ${sc>other?'lead':''}"><div style="flex:1;min-width:0">${pline(pid,[p.club,p.city].filter(Boolean).join(' · '))}
    <div class="row" style="gap:8px;margin-top:7px">${catBadge(p,12)}</div>${pips(sc)}</div>
   ${ADMIN&&m.st!=='done'?`<div class="row" style="gap:8px"><button class="sbtn" data-sc="${key}|-1" type="button">−</button>
     <span class="sval">${sc}</span><button class="sbtn" data-sc="${key}|1" type="button">+</button></div>`
    :`<span class="sval">${m.st==='pending'?'—':sc}</span>`}</div>`;
 };
 $('#dr-b').innerHTML=`<div class="row wr" style="gap:7px;margin-bottom:12px">
   <span class="chip ${m.st==='live'?'live':m.st==='done'?'ok':''}">${m.st==='live'?'<span class="dot"></span>стол '+m.tbl:m.st==='done'?(m.bye?'авто-проход':'завершён '+esc(m.at||'')):'ожидает вызова'}</span>
   <span class="chip">до ${ST.t.race}</span><span class="chip st">${esc(ST.t.disc)}</span></div>
  <div class="grid" style="gap:10px">${row(m.a,m.sa,m.sb,'a')}${row(m.b,m.sb,m.sa,'b')}</div>`;
 const fr=freeT();
 let foot='<button class="btn" data-x="1" type="button">Закрыть</button>';
 if(ADMIN&&both){
  if(m.st==='done'&&!m.bye)foot+='<button class="btn" data-act="undo" type="button">Отменить результат</button>';
  else if(m.st==='live'){const can=m.sa>=ST.t.race||m.sb>=ST.t.race;
   foot+=`<button class="btn ${can?'gold':''}" data-act="fin" type="button" ${can?'':'disabled'}>${can?'Завершить матч':'Счёт до '+ST.t.race}</button>`}
  else if(m.st==='pending')foot+=`<button class="btn core" data-call="${id}|${fr[0]||''}" type="button" ${fr.length?'':'disabled'}>${fr.length?'На стол '+fr[0]:'Столы заняты'}</button>`;
 }
 $('#dr-f').innerHTML=foot;
 $('#drawer').classList.add('on');$('#scrim').classList.add('on');
}
const closeDrawer=()=>{S.openM=null;$('#drawer').classList.remove('on');if(!$('#modal').classList.contains('on'))$('#scrim').classList.remove('on')};

/* ============================== РЕНДЕР ============================== */
const VIEWS={tour:vTour,bracket:vBracket,board:vBoard,people:vPeople,player:vPlayer,cfg:vCfg};
function shell(){
 document.getElementById('root').innerHTML=`<div class="app">
  <nav class="rail" id="rail"></nav>
  <header class="topbar"><div class="logo"></div><div class="wordmark">MATCHFLOW<b> OS</b></div>
   <div class="sepv" style="height:22px"></div>
   <div class="tsel"><span class="tname" id="tb-name"></span><span class="tmeta" id="tb-meta"></span></div>
   <div class="top-sp"></div><span class="sync ok" id="sync"><i></i>сохранено</span>
   <button class="btn sm" id="pinb" type="button">Судейская</button></header>
  <div class="judgebar" id="jbar"></div>
  <main class="main" id="main"><div class="wrap" id="view"></div></main></div>
 <div class="scrim" id="scrim"></div>
 <aside class="drawer" id="drawer" role="dialog" aria-label="Карточка матча">
  <div class="dr-h"><div style="flex:1;min-width:0"><div class="h-sec" id="dr-k">МАТЧ</div>
   <div style="font-family:var(--disp);font-size:15px;font-weight:600" id="dr-t">—</div></div>
   <button class="xb" data-x="1" type="button" aria-label="Закрыть">✕</button></div>
  <div class="dr-b" id="dr-b"></div><div class="dr-f" id="dr-f"></div></aside>
 <div class="modal" id="modal" role="dialog"><div class="md-h"><h3 style="flex:1;font-size:15px" id="md-t"></h3>
   <button class="xb" data-x="1" type="button" aria-label="Закрыть">✕</button></div><div class="md-b" id="md-b"></div></div>
 <div class="toast" id="toast"></div>`;
}
function render(){
 document.body.classList.toggle('adm',ADMIN);
 $('#rail').innerHTML=NAV().map(([k,l])=>`<button class="navb ${k==='cfg'?'jd':''} ${S.view===k?'on':''}" data-nav="${k}" type="button">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg><span>${l}</span></button>`).join('')+'<div class="rail-sp"></div>';
 $('#tb-name').textContent=ST.t.name;
 $('#tb-meta').textContent=[ST.t.disc,ST.t.venue].filter(Boolean).join(' · ');
 $('#pinb').textContent=ADMIN?'Выйти из судейской':'Судейская';
 $('#pinb').className='btn sm'+(ADMIN?' core':'');
 const jb=$('#jbar');
 if(ADMIN){jb.innerHTML=`<span class="chip live"><span class="dot"></span>режим судьи</span>
   <span class="dim">заявок: <b style="color:var(--ink)">${pending().length}</b></span>
   <span class="dim">в игре: <b style="color:var(--ink)">${liveM().length}</b></span>
   <span class="dim">очередь: <b style="color:var(--ink)">${queueM().length}</b></span><span style="flex:1"></span>
   ${ST.t.status==='reg'?'<button class="btn sm core" data-act="draw:status" type="button">Жеребьёвка</button>':''}
   ${ST.t.status==='live'&&ST.br&&MM('GF').st==='done'?'<button class="btn sm gold" data-act="close" type="button">Закрыть турнир</button>':''}`}
 else jb.innerHTML='';
 $('#view').innerHTML=(VIEWS[S.view]||vTour)();
 setSync(SYNC);
 if(S.view==='bracket')requestAnimationFrame(drawLinks);
 if(S.view==='people')filterPeople();
}
function go(v){S.view=v;S.hot=null;const m=$('#main');if(m)m.scrollTop=0;render()}

/* ---------- СОБЫТИЯ ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-nav],[data-m],[data-p],[data-call],[data-act],[data-x],[data-sc],#pinb,#r-go,#pin-go');
 if(!t)return;
 if(t.id==='pinb')return pinForm();
 if(t.id==='r-go')return addReg(t.dataset.auto==='1');
 if(t.id==='pin-go')return tryPin();
 if(t.dataset.x)return(closeModal(),closeDrawer());
 if(t.dataset.sc){const parts=t.dataset.sc.split('|'),m=MM(S.openM);
  if(parts[0]==='a')m.sa=Math.max(0,Math.min(ST.t.race,m.sa+ +parts[1]));else m.sb=Math.max(0,Math.min(ST.t.race,m.sb+ +parts[1]));
  save();openMatch(S.openM);const sc=$('#main').scrollTop;render();$('#main').scrollTop=sc;return}
 if(t.dataset.call){const parts=t.dataset.call.split('|');return callTable(parts[0],parts[1])}
 if(t.dataset.nav)return go(t.dataset.nav);
 if(t.dataset.p){S.player=t.dataset.p;closeDrawer();return go('player')}
 if(t.dataset.m)return openMatch(t.dataset.m);
 if(t.dataset.act)return act(t.dataset.act);
});
document.addEventListener('change',e=>{
 const s=e.target.closest('[data-cat]');if(!s)return;
 const p=P(s.dataset.cat);if(!p)return;
 p.cat=+s.value||0;toast('Статус: '+CATS()[p.cat].code);save();
 const row=s.closest('tr');if(row){const av=row.querySelector('.av'),col=CATS()[p.cat].c;
  if(av){av.style.background=col+'22';av.style.color=col;av.style.borderColor=col+'44'}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;filterPeople()}});
function act(a){
 const i=a.indexOf(':'),k=i<0?a:a.slice(0,i),arg=i<0?'':a.slice(i+1);
 if(k==='reg')return regForm(false);
 if(k==='addp')return regForm(true);
 if(k==='draw')return draw(arg||'status');
 if(k==='close')return closeTour();
 if(k==='new')return confirmBox('Открыть новый турнир?','Сетка и результаты текущего турнира будут удалены. Игроки и статусы останутся.',newTour);
 if(k==='wipe')return confirmBox('Удалить всё?','Все игроки, заявки, сетка и лента будут стёрты. Отменить нельзя.',()=>{
   ST.players=[];ST.br=null;ST.feed=[];ST.arch=[];ST.t.status='reg';feed('Данные очищены судьёй');toast('Готово');save();go('tour')});
 if(k==='savecfg')return saveCfg();
 if(k==='savecats')return saveCats();
 if(k==='catadd'){ST.cats=CATS().slice();ST.cats.push({code:'НОВЫЙ СТАТУС',c:'#9BB4C7'});save();return render()}
 if(k==='catdel'){const c=CATS().slice();if(c.length<2)return toast('Нужен хотя бы один статус');
   c.splice(+arg,1);ST.cats=c;ST.players.forEach(p=>{p.cat=Math.max(0,Math.min(c.length-1,p.cat|0))});save();return render()}
 if(k==='catup'){const c=CATS().slice(),j=+arg;if(j<1)return;
   const tmp=c[j-1];c[j-1]=c[j];c[j]=tmp;ST.cats=c;
   ST.players.forEach(p=>{if((p.cat|0)===j)p.cat=j-1;else if((p.cat|0)===j-1)p.cat=j});save();return render()}
 if(k==='fin')return finish(S.openM);
 if(k==='undo')return undo(S.openM);
 if(k==='edit')return editForm(arg);
 if(k==='ok'){const p=P(arg);if(p){p.st='ok';feed(`<b>${esc(p.name)}</b> — в составе`);toast('В составе');save();render()}return}
 if(k==='no'){const p=P(arg);if(p){p.st='no';toast('Отклонён');save();render()}return}
 if(k==='back'){const p=P(arg);if(p){p.st='new';toast('Вернул в заявки');save();render()}return}
 if(k==='del'){const p=P(arg);if(!p)return;
   confirmBox('Удалить игрока?',p.name+' будет удалён из базы.',()=>{
    ST.players=ST.players.filter(x=>x.id!==arg);toast('Удалён');save();go(S.view==='player'?'people':S.view)});return}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}
 if(e.key==='Enter'&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.m)document.activeElement.click()});
document.addEventListener('mouseover',e=>{if(S.view!=='bracket')return;
 const s=e.target.closest('[data-pid]'),id=s?s.dataset.pid:null;
 if(id!==S.hot){S.hot=id;hotPaths()}});
window.addEventListener('resize',()=>{if(S.view==='bracket')drawLinks()});

/* ---------- СТАРТ ---------- */
shell();
document.body.classList.toggle('adm',ADMIN);
$('#scrim').addEventListener('click',()=>{closeModal();closeDrawer()});
render();
(async function boot(){
 try{if(typeof claude!=='undefined'&&claude&&typeof claude.use==='function')CAP=await claude.use('artifact')}catch(e){CAP=null}
 if(!CAP){LOCAL=true;
  try{const ls=localStorage.getItem('mfos');if(ls){const o=JSON.parse(ls);if(o&&o.t&&o.players)ST=o}}catch(e){}
  setSync('local');render();
 }else setSync('ok');
})();
</script>
